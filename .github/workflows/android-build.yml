name: AccuWeather CI

on:
  push:
    branches:
      - main
      - development
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - development
      - feature/*
      - bugfix/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Build the whole Debug APK (more useful than just compiling Kotlin)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      # Non-blocking unit tests (won't fail the whole workflow)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace || true
        continue-on-error: true

      # Create a Release bundle (AAB) for testing/distribution
      - name: Build Release AAB
        run: ./gradlew app:bundleRelease --stacktrace --info

      # Upload artifacts so you can download them from the Actions run
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AccuWeather-Debug-APK
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AccuWeather-Release-AAB
          path: app/build/outputs/bundle/release/**/*.aab
          if-no-files-found: warn
